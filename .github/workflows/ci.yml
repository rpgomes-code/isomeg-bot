name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: isomeg
          POSTGRES_PASSWORD: isomeg
          POSTGRES_DB: isomeg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isomeg -d isomeg_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CLIENT_TOKEN: test-token
      DATABASE_URL: postgresql://isomeg:isomeg@localhost:5432/isomeg_test
      RUN_DB_TESTS: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Migration smoke test
        run: node -e "require('./dist/db/migrate').runMigrations().then(() => console.log('migration-ok'))"

      - name: Test
        run: pnpm test:run

      - name: Docker build
        run: docker build -t isomeg-bot:ci .
